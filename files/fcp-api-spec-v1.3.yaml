                    "confirm_total": 84.98,
                    "currency": "USD",
                    "payment_handler_id": "handler_google_pay",
                    "cart_mandate": {
                      "mandate_id": "cm_001",
                      "session_id": "fcp_sess_a1b2c3d4e5f6g7h8",
                      "merchant_signature": "eyJhbGciOiJFUzI1NiJ9.merchant...",
                      "user_counter_signature": "eyJhbGciOiJFUzI1NiJ9.user...",
                      "signed_at": "2026-03-24T09:44:00Z"
                    },
                    "client_context": {
                      "location": {
                        "country": "US",
                        "region": "GA",
                        "postal_code": "30301",
                        "ip_address": "203.0.113.42",
                        "ip_country": "US",
                        "is_vpn": false,
                        "is_proxy": false,
                        "is_tor": false
                      },
                      "device": {
                        "device_id": "dev_a1b2c3d4e5f6",
                        "device_type": "mobile",
                        "os": "iOS",
                        "os_version": "18.2",
                        "app_version": "4.1.0",
                        "user_agent": "FCPAgent/4.1.0 (iOS 18.2; iPhone)",
                        "fingerprint": "fp_7f8e9d0a1b2c3d4e",
                        "is_emulator": false,
