          "signed_by": {
            "type": "string",
            "description": "DID of the signing key",
            "example": "did:key:zAgent123"
          },
          "constraints": {
            "type": "object",
            "required": [
              "max_amount",
              "currency",
              "expires_at"
            ],
            "properties": {
              "max_amount": {
                "type": "number",
                "format": "double",
                "example": 300.0
              },
              "currency": {
                "type": "string",
                "example": "USD"
              },
              "merchant_id": {
                "type": "string",
                "description": "Restricts mandate to one merchant if set"
              },
              "expires_at": {
                "type": "string",
                "format": "date-time"
              },
              "allowed_categories": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              },
              "recurrence": {
                "type": "string",
                "enum": [
                  "once",
                  "daily",
                  "weekly",
                  "monthly",
                  "yearly"
                ]
              }
            }
          },
          "signature": {
            "type": "string",
            "example": "eyJhbGciOiJFUzI1NiJ9..."
