        "properties": {
          "mandate_id": {
            "type": "string",
            "example": "cm_001"
          },
          "session_id": {
            "type": "string",
            "description": "Inside the merchant's signature. Binds this mandate to the session.\nWhen the agent submits this mandate in complete, the merchant\nextracts and verifies session_id from the signed payload \u2014 not\njust from the URL.\n",
            "example": "fcp_sess_a1b2c3d4e5f6g7h8"
          },
          "intent_mandate_id": {
            "type": "string",
            "example": "im_001"
          },
          "merchant_id": {
            "type": "string",
            "example": "merch_abc123"
          },
          "line_item_snapshot": {
            "type": "array",
            "description": "Immutable cart snapshot at mandate issuance time",
            "items": {
              "$ref": "#/components/schemas/LineItemResolved"
            }
          },
          "grand_total": {
            "type": "number",
            "format": "double",
            "description": "The exact amount that will be charged",
            "example": 94.98
          },
          "currency": {
            "type": "string",
            "example": "USD"
          },
          "merchant_signature": {
            "type": "string",
            "description": "JWS over the full CartMandate payload",
            "example": "eyJhbGciOiJFUzI1NiJ9.merchant..."
          },
          "issued_at": {
            "type": "string",
            "format": "date-time"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "discounts_snapshot": {
            "type": "array",
            "description": "Discounts locked into this mandate at issuance \u2014 immutable once signed.",
            "items": {
              "$ref": "#/components/schemas/AppliedDiscount"
            }
          }
        }
      },
