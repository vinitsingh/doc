        ],
        "description": "User-signed shopping intent. Authorises the agent to act within\ndefined constraints. Both human_present and human_not_present flows\nrequire an IntentMandate.\n",
        "properties": {
          "mandate_id": {
            "type": "string",
            "example": "im_001"
