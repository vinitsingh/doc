    "/v1/checkouts/{session_id}/complete": {
      "post": {
        "tags": [
          "Checkout"
        ],
        "operationId": "completeCheckout",
        "summary": "Complete the checkout \u2014 submit signed mandate and payment handler",
        "description": "Phase 2 \u2014 AUTHORISE AND FIRE.\n\nThe agent submits three things:\n1. **`cart_mandate`** \u2014 the CartMandate with the user's counter-signature.\n   This is the purchase authorisation. It contains `session_id` inside its\n   signed payload \u2014 the cryptographic link to the checkout session.\n2. **`payment_handler_id`** \u2014 which handler to use. This is a reference,\n   not a credential. The merchant uses it to call the correct Credential\n   Provider server-to-server. The agent never sees the token.\n3. **`confirm_total`** \u2014 the agent echoes the grand_total it expects to be\n   charged. Must match the CartMandate. Guards against price drift.\n\n### Why `payment_handler_id` is here and not in a separate endpoint\nThe handler is an execution reference, not part of the purchase agreement.\nIt does not need to be inside the signed CartMandate, and it does not need\nits own round trip. Submitting it at complete is correct \u2014 it is the\ninstruction to the merchant for how to execute the payment, delivered at\nthe moment of authorisation.\n\n### What the merchant does with it\n```\nmerchant.resolve_payment(\n  mandate_id:   cart_mandate.mandate_id,\n  handler_id:   payment_handler_id,    \u2190 from this request\n  grand_total:  cart_mandate.grand_total\n)\n\u2192 CP delivers token to PSP directly\n\u2192 PSP captures\n\u2192 merchant creates order\n```\n\nThe agent never touches the token.\n\n### Verification sequence\n1. Session status == `ready`\n2. `cart_mandate.session_id` == URL `session_id`\n3. Merchant signature on CartMandate is valid\n4. User counter-signature (or agent auto-sig) is valid\n5. `cart_mandate.grand_total` == server-recomputed total\n6. `confirm_total` == `cart_mandate.grand_total`\n7. IntentMandate constraints still satisfied\n8. `payment_handler_id` is declared in merchant profile\n9. Merchant calls CP \u2192 CP delivers token to PSP \u2192 PSP captures\n10. Order created\n\n**Idempotency key required.**\n**Irreversible** once `status: completed` is returned.\n",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          },
          {
            "$ref": "#/components/parameters/FCPAgent"
          },
          {
            "$ref": "#/components/parameters/FCPVersion"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CompleteCheckoutRequest"
              },
              "examples": {
                "human_present": {
                  "summary": "Human-present completion with client_context delta check",
