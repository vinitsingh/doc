  "paths": {
    "/.well-known/fcp": {
      "get": {
        "tags": [
          "Discovery"
        ],
        "operationId": "getMerchantProfile",
        "summary": "Fetch merchant capability profile",
        "security": [],
        "description": "Returns the merchant's capability profile. Agents fetch this before any\nsession. The `payment_handlers` list is what the agent presents to the\nuser when they need to select a payment method \u2014 this happens client-side\nbetween CREATE and COMPLETE. No extra API call needed.\n",
        "responses": {
          "200": {
            "description": "Merchant capability profile",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MerchantProfile"
                },
                "example": {
                  "fcp_version": "1.3",
                  "merchant_id": "merch_abc123",
                  "display_name": "Acme Electronics",
                  "profile_uri": "https://acme.example/.well-known/fcp",
                  "capabilities": [
                    {
                      "name": "fcp.checkout",
                      "version": "1.3",
                      "endpoint": "/v1/checkouts"
                    },
                    {
                      "name": "fcp.catalog",
                      "version": "1.0",
                      "endpoint": "/v1/catalog"
                    },
                    {
                      "name": "fcp.orders",
                      "version": "1.0",
                      "endpoint": "/v1/orders"
                    }
                  ],
                  "payment_handlers": [
                    {
                      "id": "handler_google_pay",
                      "name": "Google Pay",
                      "type": "delegated_token",
                      "display_icon_url": "https://acme.example/icons/gpay.svg"
                    },
                    {
                      "id": "handler_apple_pay",
                      "name": "Apple Pay",
                      "type": "delegated_token",
                      "display_icon_url": "https://acme.example/icons/apay.svg"
                    },
                    {
                      "id": "handler_stripe_card",
                      "name": "Credit / Debit Card",
                      "type": "delegated_token",
                      "display_icon_url": "https://acme.example/icons/card.svg"
                    }
                  ],
                  "trust_anchor": {
                    "did": "did:web:acme.example",
                    "signing_key_jwk": {
                      "kty": "EC",
                      "crv": "P-256",
                      "x": "f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU",
                      "y": "x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0"
                    }
                  }
                }
              }
            }
          }
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/FCPClientContext"
          }
        ]
      }
    },
    "/v1/checkouts": {
      "post": {
        "tags": [
          "Checkout"
        ],
        "operationId": "createCheckout",
        "summary": "Create a checkout session",
        "description": "Phase 1 \u2014 WHAT TO BUY.\n\nSubmits cart intent: items, buyer, and the user-signed IntentMandate.\nNo payment information. The grand_total is unknown until the merchant\ncomputes tax, shipping, and discounts server-side.\n\nThe merchant responds with a CartMandate \u2014 a merchant-signed document\ncontaining the session_id, exact items, and grand_total. The agent\npresents this to the user, who:\n1. Sees the final price\n2. Picks a payment handler from the merchant profile list (client-side)\n3. Counter-signs the CartMandate (biometric / PIN on device)\n\nThen the agent calls complete.\n\n**Idempotency key required.**\n",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          },
          {
            "$ref": "#/components/parameters/FCPAgent"
          },
          {
            "$ref": "#/components/parameters/FCPVersion"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateCheckoutRequest"
              },
              "examples": {
                "human_present_loyalty_discount": {
                  "summary": "Human-present with loyalty redemption + promo code + client_context",
                  "value": {
                    "mode": "human_present",
                    "line_items": [
                      {
                        "catalog_id": "item_headphones_pro",
                        "quantity": 1
                      },
                      {
                        "catalog_id": "item_usbc_cable",
                        "quantity": 2
                      }
                    ],
                    "buyer": {
                      "email": "jane@example.com",
                      "shipping_address": {
                        "name": "Jane Doe",
                        "line1": "123 Main St",
                        "city": "Atlanta",
                        "state": "GA",
                        "postal_code": "30301",
                        "country": "US"
                      }
                    },
                    "discounts": [
                      {
                        "type": "PROMO_CODE",
                        "code": "SUMMER15"
                      },
                      {
                        "type": "LOYALTY_REDEMPTION",
                        "loyalty_points": 1000
                      }
                    ],
                    "loyalty": {
                      "account_id": "loyalty_jane_001",
                      "redeem_points": 1000
                    },
                    "intent_mandate": {
                      "mandate_id": "im_001",
                      "signed_by": "did:key:zAgent123",
                      "constraints": {
                        "max_amount": 300.0,
                        "currency": "USD",
