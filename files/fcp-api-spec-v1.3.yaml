                        "latitude": 33.749,
                        "longitude": -84.388,
                        "country": "US",
                        "region": "GA",
                        "city": "Atlanta",
                        "postal_code": "30301",
                        "ip_address": "203.0.113.42",
                        "ip_country": "US",
                        "is_vpn": false,
                        "is_proxy": false,
                        "is_tor": false
                      },
                      "device": {
                        "device_id": "dev_a1b2c3d4e5f6",
                        "device_type": "mobile",
                        "os": "iOS",
                        "os_version": "18.2",
                        "app_version": "4.1.0",
                        "user_agent": "FCPAgent/4.1.0 (iOS 18.2; iPhone)",
                        "fingerprint": "fp_7f8e9d0a1b2c3d4e",
                        "is_emulator": false,
                        "is_rooted": false,
                        "screen_resolution": "390x844",
                        "language": "en-US",
                        "timezone": "America/New_York"
                      },
