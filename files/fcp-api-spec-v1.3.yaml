        "type": "object",
        "required": [
          "country",
          "ip_address"
        ],
        "description": "Geographic origin of the request. Used for:\n- Tax jurisdiction determination (country + region + postal_code)\n- Geo-restricted product screening\n- Sanctions / OFAC country checks\n- PSD2 SCA threshold determination (EU)\n- GDPR region identification",
        "properties": {
          "latitude": {
            "type": "number",
            "format": "double",
            "description": "GPS latitude. Omit for server-side agents.",
            "example": 33.749
          },
          "longitude": {
            "type": "number",
            "format": "double",
            "description": "GPS longitude.",
            "example": -84.388
          },
          "country": {
            "type": "string",
            "pattern": "^[A-Z]{2}$",
            "description": "ISO 3166-1 alpha-2 country code derived from GPS or IP.",
            "example": "US"
          },
          "region": {
            "type": "string",
            "description": "State / province / region code.",
            "example": "GA"
          },
          "city": {
            "type": "string",
            "example": "Atlanta"
          },
          "postal_code": {
            "type": "string",
            "description": "Used for precise tax jurisdiction resolution.",
            "example": "30301"
          },
          "ip_address": {
            "type": "string",
            "description": "IPv4 or IPv6 of the requesting client.",
            "example": "203.0.113.42"
          },
          "ip_country": {
            "type": "string",
            "pattern": "^[A-Z]{2}$",
            "description": "Country resolved from IP geolocation. May differ from GPS country \u2014 mismatch is a risk signal.",
            "example": "US"
          },
          "is_vpn": {
            "type": "boolean",
            "description": "IP identified as a known VPN exit node.",
            "example": false
          },
          "is_proxy": {
            "type": "boolean",
            "description": "IP identified as an open or commercial proxy.",
            "example": false
          },
          "is_tor": {
            "type": "boolean",
            "description": "IP identified as a Tor exit node.",
            "example": false
          }
        }
      },
      "DeviceContext": {
        "type": "object",
        "required": [
          "device_id",
          "device_type",
          "user_agent"
        ],
        "description": "Device and client identity. Used for:\n- Known-device trust scoring (recognised device = lower friction)\n- Session hijack detection: device_id mismatch between create and complete triggers alert\n- Agent vs human traffic classification\n- Fraud pattern matching against device fingerprint",
        "properties": {
          "device_id": {
            "type": "string",
            "description": "Stable per-device ID. Must be consistent across the session \u2014 mismatch between create and complete triggers a security alert.",
            "example": "dev_a1b2c3d4e5f6"
          },
          "device_type": {
            "type": "string",
            "enum": [
              "mobile",
              "tablet",
              "desktop",
              "wearable",
              "tv",
              "server",
              "iot",
              "unknown"
            ],
            "example": "mobile"
          },
          "os": {
            "type": "string",
            "example": "iOS"
          },
          "os_version": {
            "type": "string",
            "example": "18.2"
          },
          "app_version": {
            "type": "string",
            "description": "Version of the agent app or runtime.",
            "example": "4.1.0"
          },
          "user_agent": {
            "type": "string",
            "description": "Full User-Agent string.",
            "example": "FCPAgent/4.1.0 (iOS 18.2; iPhone)"
          },
          "fingerprint": {
            "type": "string",
            "description": "Hardware/software hash for cross-session fraud correlation.",
            "example": "fp_7f8e9d0a1b2c3d4e"
          },
          "is_emulator": {
            "type": "boolean",
            "description": "Device is a software emulator \u2014 associated with automated fraud tooling.",
            "example": false
          },
          "is_rooted": {
            "type": "boolean",
            "description": "OS has been rooted or jailbroken \u2014 weakened key storage, elevated risk.",
            "example": false
          },
          "screen_resolution": {
            "type": "string",
            "description": "WxH pixels (mobile/desktop only).",
            "example": "390x844"
          },
          "language": {
            "type": "string",
            "description": "Device/app locale.",
            "example": "en-US"
          },
          "timezone": {
            "type": "string",
            "description": "IANA timezone.",
            "example": "America/New_York"
          }
        }
      },
      "RiskContext": {
        "type": "object",
        "description": "Behavioural and account-level risk signals computed by the agent app or a client-side risk SDK. Merchant combines with server-side scoring. A risk_score above the merchant threshold triggers SCA (step-up auth) or rejection.",
        "properties": {
          "session_age_seconds": {
            "type": "integer",
            "description": "Active session duration in seconds. Very short + high-value order = automated fraud pattern.",
            "example": 142
          },
          "is_new_device": {
            "type": "boolean",
            "description": "First-seen device_id for this user.",
            "example": false
          },
          "previous_orders_count": {
            "type": "integer",
            "description": "Total historical orders by this user at this merchant.",
            "example": 7
          },
          "account_age_days": {
            "type": "integer",
            "description": "Age of the user account at this merchant in days.",
            "example": 412
          },
          "velocity_last_1h": {
            "type": "integer",
            "description": "Checkout attempts in the last 1 hour.",
            "example": 1
          },
          "velocity_last_24h": {
            "type": "integer",
            "description": "Checkout attempts in the last 24 hours.",
            "example": 2
          },
          "risk_score": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100,
            "description": "Composite score 0\u2013100. 0 = no risk, 100 = max risk. Merchant configures thresholds: e.g. >70 = SCA required, >90 = reject.",
            "example": 12
          },
          "risk_signals": {
            "type": "array",
            "description": "Discrete flags contributing to risk_score. Empty array means no signals triggered.",
            "items": {
              "type": "string",
              "enum": [
                "new_shipping_address",
                "shipping_billing_mismatch",
                "high_value_first_order",
                "rapid_cart_assembly",
                "multiple_payment_attempts",
                "unusual_time_of_day",
                "ip_country_mismatch",
                "device_fingerprint_mismatch",
                "account_recently_created",
                "password_recently_changed"
              ]
            },
            "example": []
          },
          "three_ds_exemption_claimed": {
            "type": "string",
            "description": "PSD2 3DS exemption reason if claimed. Null = no exemption, SCA proceeds normally.",
            "enum": [
              "low_value",
              "trusted_beneficiary",
              "recurring_transaction",
              "corporate_payment",
              "low_risk_analysis"
            ],
            "nullable": true,
            "example": null
          }
        }
      },
      "DiscountInput": {
        "type": "object",
        "required": [
          "type"
        ],
        "description": "A discount to apply to the checkout. Replaces bare string codes.",
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "PROMO_CODE",
              "AUTOMATIC",
              "LOYALTY_REDEMPTION",
              "AGENT_OFFER",
              "BUNDLE"
            ],
            "description": "PROMO_CODE: user-entered code \u2014 requires code field\nAUTOMATIC: merchant rule \u2014 no input needed\nLOYALTY_REDEMPTION: points redemption \u2014 requires loyalty.redeem_points\nAGENT_OFFER: personalised offer \u2014 requires offer_id\nBUNDLE: bundle pricing \u2014 merchant applies automatically",
            "example": "PROMO_CODE"
          },
          "code": {
            "type": "string",
            "description": "Required for PROMO_CODE.",
            "example": "SUMMER15"
          },
          "offer_id": {
            "type": "string",
            "description": "Required for AGENT_OFFER.",
            "example": "offer_abc123"
          },
          "loyalty_points": {
            "type": "integer",
            "description": "Points being redeemed \u2014 informational for LOYALTY_REDEMPTION.",
            "example": 1000
          }
        }
      },
      "DiscountPolicy": {
        "type": "object",
        "description": "Merchant discount stacking rules declared in the capability profile.",
        "properties": {
          "max_discounts_per_order": {
            "type": "integer",
            "description": "Maximum stackable discounts per order.",
            "example": 3
          },
          "stackable_types": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "example": [
              "PROMO_CODE",
              "LOYALTY_REDEMPTION",
              "AUTOMATIC"
            ]
          },
          "non_stackable_types": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "These types cannot be combined with others.",
            "example": [
              "BUNDLE"
            ]
          }
        }
      },
      "LoyaltyProgram": {
        "type": "object",
        "description": "Loyalty programme declaration in the merchant capability profile.",
        "properties": {
          "program_id": {
            "type": "string",
            "example": "acme_rewards"
          },
          "program_name": {
            "type": "string",
            "example": "Acme Rewards"
          },
          "currency_name": {
            "type": "string",
            "description": "Display name for points (Points, Miles, Stars).",
            "example": "Points"
          },
          "earn_rate": {
            "type": "number",
            "format": "double",
            "description": "Points earned per $1 spent.",
            "example": 10
          },
          "earn_rate_description": {
            "type": "string",
            "example": "10 points per $1 spent"
          },
          "redemption_rate": {
            "type": "number",
            "format": "double",
            "description": "Dollar value of one point.",
            "example": 0.01
          },
          "redemption_rate_description": {
            "type": "string",
            "example": "100 points = $1"
          },
          "min_redemption_points": {
            "type": "integer",
            "description": "Minimum points required to redeem at once.",
            "example": 500
          }
        }
      },
      "LoyaltyCheckoutInput": {
        "type": "object",
        "description": "Loyalty redemption submitted in CreateCheckout or UpdateCheckout.",
        "properties": {
          "account_id": {
            "type": "string",
            "description": "Loyalty account to attach to this session.",
            "example": "loyalty_jane_001"
          },
          "redeem_points": {
            "type": "integer",
            "minimum": 0,
            "description": "Points to redeem. Must be >= min_redemption_points. Converted to a LOYALTY_REDEMPTION discount entry.",
            "example": 1000
          }
        }
      },
      "LoyaltyCheckoutResult": {
        "type": "object",
        "description": "Loyalty outcome returned in CompleteResponse.",
        "properties": {
          "account_id": {
            "type": "string",
            "example": "loyalty_jane_001"
          },
          "points_redeemed": {
            "type": "integer",
            "description": "Points redeemed as discount on this order.",
            "example": 1000
          },
          "redemption_value_usd": {
            "type": "number",
            "format": "double",
            "description": "Dollar value of redeemed points.",
            "example": 10.0
          },
          "points_earned": {
            "type": "integer",
            "description": "Points earned from this purchase (pending settlement).",
            "example": 750
          },
          "new_balance": {
            "type": "integer",
            "description": "Projected balance after redemption and earn.",
            "example": 3250
          }
        }
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Invalid request",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "Missing or invalid credentials",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "NotFound": {
        "description": "Resource not found",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Conflict": {
        "description": "State conflict",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "UnprocessableEntity": {
        "description": "Business logic validation failure",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "InternalServerError": {
        "description": "Unexpected server error",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    }
  },
  "security": [
    {
      "OAuth2": [
        "fcp.checkout"
      ]
    }
  ]
}
