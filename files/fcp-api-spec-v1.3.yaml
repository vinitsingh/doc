{
  "openapi": "3.1.0",
  "info": {
    "title": "FCP \u2014 Federated Commerce Protocol",
    "version": "1.0.0",
    "description": "# FCP \u2014 Federated Commerce Protocol\n**Version:** 1.0.0  |  **License:** Apache 2.0  |  **Status:** Draft\n\n---\n\n## Overview\n\nFCP (Federated Commerce Protocol) is an open, vendor-neutral protocol for the\nfull lifecycle of agentic commerce \u2014 from merchant capability discovery through\nto payment settlement. It defines a standard language for AI agents, merchants,\nand payment providers to interoperate without custom integrations.\n\n---\n\n## Protocol Actors\n\n| Actor | Role |\n|-------|------|\n| **Consumer Agent (CA)** | AI acting on behalf of the user. Orchestrates the checkout flow. Never handles raw payment credentials. |\n| **Merchant Agent (MA)** | Business backend. Computes totals, issues CartMandate, owns order fulfillment. Always Merchant of Record. |\n| **Credential Provider (CP)** | Issues payment tokens scoped to a CartMandate. Delivers tokens directly to the PSP. |\n| **Payment Service Provider (PSP)** | Receives SettlementMandate from the merchant. Executes fund capture. |\n\n---\n\n## Session Lifecycle\n\n```\nDISCOVER \u2192 CREATE \u2192 [GET / PATCH] \u2192 COMPLETE\n               \u2193                        \u2193\n            CANCEL  \u2190\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n| State | Description |\n|-------|-------------|\n| `pending_mandate` | CartMandate issued by merchant. User reviewing price and counter-signing. |\n| `ready` | CartMandate signed. Safe to call complete. |\n| `completed` | Payment captured. Order created. Terminal. |\n| `cancelled` | Terminated before completion. Mandate voided. Terminal. |\n| `expired` | TTL elapsed. 15 min for human_present. 24 hr for human_not_present. Terminal. |\n\n---\n\n## Two-Phase Checkout\n\n### Phase 1 \u2014 WHAT TO BUY  \u2192  `POST /v1/checkouts`\nSubmit cart intent: items, buyer, discounts, loyalty redemption, and the\nuser-signed IntentMandate. No payment information. The merchant computes\ntax, shipping, and discounts server-side and returns a signed CartMandate\nwith the locked `grand_total`.\n\n### Phase 2 \u2014 AUTHORISE AND FIRE  \u2192  `POST /v1/checkouts/{id}/complete`\nSubmit the signed CartMandate, payment handler reference, and `confirm_total`\necho. The merchant verifies the full mandate chain, then resolves the payment\ntoken server-to-server (CP \u2192 PSP). The agent never sees the token.\n\n---\n\n## client_context \u2014 Required on Every Request\n\nEvery FCP request must carry location, device, and risk signals.\n\n**On GET requests** \u2014 submit as `FCP-Client-Context` header (base64url-encoded JSON).\n**On POST / PATCH requests** \u2014 submit as `client_context` field in the request body.\n\n### location\nUsed for tax jurisdiction, geo-restriction screening, sanctions checks, and PSD2 SCA thresholds.\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `country` | string | ISO 3166-1 alpha-2. Required. |\n| `region` | string | State / province code. |\n| `postal_code` | string | Precise tax jurisdiction. |\n| `ip_address` | string | IPv4 or IPv6. Required. |\n| `ip_country` | string | Country resolved from IP. Mismatch vs GPS = risk signal. |\n| `is_vpn` | boolean | IP is a known VPN exit node. |\n| `is_proxy` | boolean | IP is an open or commercial proxy. |\n| `is_tor` | boolean | IP is a Tor exit node. |\n\n### device\nUsed for session hijack detection, known-device trust scoring, and fraud clustering.\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `device_id` | string | Stable per-device ID. Required. Must be consistent across the session \u2014 mismatch between create and complete triggers a security alert. |\n| `device_type` | enum | mobile, tablet, desktop, server, iot, unknown. |\n| `fingerprint` | string | Hardware/software hash for cross-session correlation. |\n| `is_emulator` | boolean | Emulators associated with automated fraud tooling. |\n| `is_rooted` | boolean | Rooted/jailbroken OS weakens key storage \u2014 elevated risk. |\n| `user_agent` | string | Full User-Agent string. Required. |\n\n### risk\nUsed for real-time fraud scoring and SCA threshold decisions.\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `risk_score` | integer 0\u2013100 | Composite score. 0 = no risk, 100 = max risk. Merchant configures thresholds (e.g. >70 = SCA, >90 = reject). |\n| `risk_signals` | string[] | Discrete flags: new_shipping_address, shipping_billing_mismatch, rapid_cart_assembly, ip_country_mismatch, etc. |\n| `velocity_last_1h` | integer | Checkout attempts in last 1 hour. |\n| `velocity_last_24h` | integer | Checkout attempts in last 24 hours. |\n| `session_age_seconds` | integer | Very short + high-value = automated fraud pattern. |\n| `account_age_days` | integer | New accounts with large orders = common fraud pattern. |\n| `three_ds_exemption_claimed` | enum | PSD2 exemption if claimed: low_value, recurring_transaction, trusted_beneficiary, etc. |\n\n### Delta Check at complete\nThe merchant compares `client_context` at complete time against the one submitted at create:\n- `device_id` changed \u2192 possible session hijack \u2192 **reject**\n- `location.country` changed \u2192 geo inconsistency \u2192 **flag for review**\n- `risk_score` spike \u2192 elevated fraud signal \u2192 **SCA step-up**\n\n---\n\n## Discounts\n\nDiscounts are first-class typed objects \u2014 not bare strings.\n\n| Type | Submitted By | Requires | Description |\n|------|-------------|----------|-------------|\n| `PROMO_CODE` | Agent | `code` field | User-entered promotional code. |\n| `AUTOMATIC` | Merchant | Nothing | Rule-based (e.g. buy 2 get 10% off). Applied automatically. |\n| `LOYALTY_REDEMPTION` | Agent via loyalty | `loyalty.redeem_points` | Points redeemed as dollar value. |\n| `AGENT_OFFER` | Agent | `offer_id` | Personalised offer surfaced by the agent. |\n| `BUNDLE` | Merchant | Nothing | Cross-item bundle pricing. Applied automatically. |\n\n**Stackability** is declared in `MerchantProfile.discount_policy`. Rejected discounts\nsurface in `CheckoutSession.discounts_rejected` without aborting the session.\n\nAll applied discounts are locked into `CartMandateIssued.discounts_snapshot` \u2014\nimmutable once the mandate is signed.\n\n---\n\n## Loyalty\n\nLoyalty is embedded in the checkout session \u2014 no separate endpoint.\n\n| Step | Where | What |\n|------|-------|------|\n| 1. Submit redemption | `CreateCheckoutRequest.loyalty` | `account_id` + `redeem_points` |\n| 2. View session balance | `CheckoutSession.loyalty_session` | balance, redeemed amount, projected earn |\n| 3. Locked into mandate | `CartMandateIssued.discounts_snapshot` | Appears as `LOYALTY_REDEMPTION` discount |\n| 4. Result on complete | `CompleteResponse.loyalty_result` | `points_earned`, `points_redeemed`, `new_balance` |\n\n---\n\n## Mandate Chain\n\nEvery FCP transaction produces a cryptographic audit trail of three linked credentials:\n\n| Mandate | Issued By | Signed By | Purpose |\n|---------|-----------|-----------|---------|\n| **IntentMandate** | Consumer Agent | User (hardware-backed key) | Captures shopping intent and constraints (max_amount, merchant, expiry). Authorises the agent to act. |\n| **CartMandate** | Merchant Agent | Merchant first, then User counter-signs | Locks in exact items, price, session_id, and payment handler. Non-repudiable proof of what was agreed. |\n| **SettlementMandate** | Merchant Agent | Merchant | Packages verified chain for PSP. Never seen by the Consumer Agent. |\n\n### How checkout and complete are associated\n`cart_mandate.session_id` is embedded inside the merchant's JWS signature.\nAt complete, the merchant extracts and verifies it from within the signed payload \u2014\nnot just from the URL. It cannot be altered without breaking the signature.\n\n---\n\n## Payment Token Flow\n\nThe agent submits `payment_handler_id` as a reference only \u2014 it tells the merchant\nwhich Credential Provider to call. The token is resolved server-to-server.\nThe agent never receives, holds, or transmits any payment credential.\n\n```\nAgent               Merchant           Credential Provider    PSP\n  \u2502                    \u2502                       \u2502               \u2502\n  \u2502  POST /complete    \u2502                       \u2502               \u2502\n  \u2502  { cart_mandate,   \u2502                       \u2502               \u2502\n  \u2502    handler_id,     \u2502  resolve_payment(     \u2502               \u2502\n  \u2502    confirm_total,  \u2502    mandate_id,        \u2502               \u2502\n  \u2502    client_context} \u2502    handler_id,        \u2502               \u2502\n  \u2502\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba\u2502    grand_total)       \u2502               \u2502\n  \u2502                    \u2502\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba\u2502               \u2502\n  \u2502                    \u2502\u25c4\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2502  token        \u2502\n  \u2502                    \u2502  SettlementMandate                    \u2502\n  \u2502                    \u2502  + token                              \u2502\n  \u2502                    \u2502\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba\u2502\n  \u2502                    \u2502\u25c4\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2502\n  \u2502  200 { order_id }  \u2502                       \u2502               \u2502\n  \u2502\u25c4\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2502                       \u2502               \u2502\n```\n\n---\n\n## Transport Headers\n\n| Header | Required | Sent On | Description |\n|--------|----------|---------|-------------|\n| `FCP-Agent` | Yes | All | `profile=\"<uri>\"` \u2014 agent capability profile URI |\n| `FCP-Version` | Yes | All | Protocol version, e.g. `1.0` |\n| `FCP-Idempotency-Key` | Required on POST | POST | Client UUID for safe retries |\n| `FCP-Client-Context` | Required on GET | GET | base64url-encoded JSON ClientContext |\n| `Authorization` | Yes | All | `Bearer <token>` OAuth 2.0 |\n\n---\n\n## API Endpoints\n\n| Method | Path | Phase | Description |\n|--------|------|-------|-------------|\n| `GET` | `/.well-known/fcp` | Discovery | Fetch merchant profile, capabilities, payment handlers, loyalty programme |\n| `POST` | `/v1/checkouts` | 1 \u2014 Intent | Create session: items, buyer, discounts, loyalty, intent_mandate |\n| `GET` | `/v1/checkouts/{id}` | Bridge | Get session state, CartMandate, loyalty balance |\n| `PATCH` | `/v1/checkouts/{id}` | Bridge | Update cart, discounts, loyalty redemption |\n| `POST` | `/v1/checkouts/{id}/cancel` | Any | Cancel: void mandate, notify CP |\n| `POST` | `/v1/checkouts/{id}/complete` | 2 \u2014 Authorise | Submit signed mandate + handler ref + client_context |\n| `POST` | `/v1/mandates/verify` | Utility | Verify mandate chain for audits or disputes |\n",
    "contact": {
      "name": "FCP Protocol Community",
      "url": "https://github.com/your-org/fcp"
    },
