    "/v1/checkouts/{session_id}": {
      "get": {
        "tags": [
          "Checkout"
        ],
        "operationId": "getCheckout",
        "summary": "Retrieve a checkout session",
        "description": "Returns current session state. Recommended: call GET immediately before\ncomplete to confirm the CartMandate hasn't been invalidated by a\nmerchant-side change (inventory drop, pricing update).\n\nThe response always includes the current CartMandate and\n`available_payment_handlers` so the agent can re-render the payment\nselection UI if needed without refetching the merchant profile.\n",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          },
          {
            "$ref": "#/components/parameters/FCPAgent"
          },
          {
            "$ref": "#/components/parameters/FCPVersion"
          },
          {
            "$ref": "#/components/parameters/FCPClientContext"
          }
        ],
        "responses": {
          "200": {
            "description": "Current session state",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CheckoutSession"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalServerError"
          }
        }
      },
      "patch": {
        "tags": [
          "Checkout"
        ],
        "operationId": "updateCheckout",
        "summary": "Update cart or buyer details",
        "description": "Modifies an active session. Any change that affects pricing (add/remove\nitems, discount, shipping address to a different tax zone) invalidates\nthe current CartMandate and triggers a new one \u2014 the agent must\nre-collect the user's counter-signature before completing.\n\nNon-price changes (buyer email, phone, metadata) do not invalidate\nthe CartMandate.\n\nNot accepted: `payment_handler_id` \u2014 that is submitted at complete.\n",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          },
